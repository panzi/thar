[package]
name = "thar"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.11.1"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.47", features = ["serde", "parsing"] }
url = { version = "2.5.8", features = ["serde"] }
